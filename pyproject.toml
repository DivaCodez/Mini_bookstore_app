[tool.poetry]
package-mode = false

[project]
name = "mini_bookstor"
version = "0.1.0"
description = "FastAPI bookstore example"
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.0.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "streamlit>=1.50.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
